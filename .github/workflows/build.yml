name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Move Files
      run: |
        # 1. Giải nén file zip
        unzip -o TPMS_Project.zip
        
        # 2. Đưa toàn bộ file từ thư mục TPMS_Project ra ngoài gốc
        cp -r TPMS_Project/* . || true
        cp -r TPMS_Project/.* . || true
        
        # 3. Khởi tạo gradle wrapper
        gradle wrapper
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TPMS-App
        path: app/build/outputs/apk/debug/app-debug.apk
