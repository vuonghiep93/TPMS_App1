name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Unzip Project
      run: |
        # Tự động tìm tất cả file .zip và giải nén
        find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \;
        
        # Đưa các file cấu hình ra thư mục gốc nếu bị nén lồng thư mục
        find . -type f -name "build.gradle" ! -path "./app/*" -execdir cp -r ./* $GITHUB_WORKSPACE/ \; || true
        
        # Khởi tạo gradle wrapper
        gradle wrapper
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TPMS-App
        path: app/build/outputs/apk/debug/app-debug.apk
